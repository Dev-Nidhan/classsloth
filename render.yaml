# Public demo only. No OAuth secrets, no uploaded notes, no model endpoint.
services:
  - type: web
    name: classsloth
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CLASSSLOTH_PUBLIC_DEMO
        value: "1"
      - key: CLASSSLOTH_TIMEZONE
        value: UTC
      - key: CLASSSLOTH_DATA_DIR
        value: /tmp/classsloth
