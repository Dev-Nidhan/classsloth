# Public demo. Gemma 3 4B runs inside this container on localhost.
# Port 11434 is not published. Classroom login and private uploads stay off.
services:
  - type: web
    name: classsloth
    runtime: docker
    plan: pro plus
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    disk:
      name: ollama-models
      mountPath: /data/ollama
      sizeGB: 10
    envVars:
      - key: CLASSSLOTH_PUBLIC_DEMO
        value: "1"
      - key: OLLAMA_MODEL
        value: gemma3:4b
      - key: OLLAMA_MODELS
        value: /data/ollama
      - key: CLASSSLOTH_NUM_CTX
        value: "4096"
      - key: CLASSSLOTH_TIMEZONE
        value: UTC
      - key: CLASSSLOTH_DATA_DIR
        value: /tmp/classsloth
